<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../_shared/base.css">
    <link rel="stylesheet" href="settings.css">
    <script type="module" src="settings.js"></script>
  </head>
  <body>
    <div class="set-layout">
      <nav id="set-nav" class="set-nav" aria-label="Settings sections" data-i18n-attr="aria-label:settings.nav">
        <div class="set-search" role="search">
          <input id="set-search" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:settings.search.placeholder; aria-label:settings.search.label">
        </div>
        <ul id="set-nav-list" class="set-nav-list"></ul>
      </nav>
      <main id="set-main" class="set-main" tabindex="-1">
        <div id="set-status" class="set-status" role="status" aria-live="polite"></div>
        <div id="set-content" class="set-content">
          <p class="wmux-muted" data-i18n="settings.loading">Loading settings…</p>
        </div>
      </main>
    </div>

    <div id="set-confirm" class="set-backdrop" hidden>
      <div class="set-dialog" role="alertdialog" aria-modal="true" aria-labelledby="set-confirm-title" aria-describedby="set-confirm-body">
        <h2 id="set-confirm-title" data-i18n="settings.confirm.title">Confirm</h2>
        <p id="set-confirm-body"></p>
        <div class="set-dialog-actions">
          <button type="button" id="set-confirm-cancel" data-i18n="settings.cancel">Cancel</button>
          <button type="button" id="set-confirm-ok" class="wmux-primary">OK</button>
        </div>
      </div>
    </div>
  </body>
</html>
